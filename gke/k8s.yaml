apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web-gke
  namespace: canary
spec:
  replicas: 3
  selector:
    matchLabels: { app: hello-web-gke }
  template:
    metadata:
      labels: { app: hello-web-gke }
    spec:
      containers:
      - name: hello-web
        image: hello-web
        ports:
        - containerPort: 8080
        resources:
          requests: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web-gke
  namespace: canary
spec:
  type: LoadBalancer
  selector: { app: hello-web-gke }
  ports:
  - port: 80
    targetPort: 8080
